# Development override — use with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Changes from production:
#   - postgres and redis exposed on localhost
#   - backend runs with tsx watch (hot reload) and exposes :3000 directly
#   - frontend not built; run `quasar dev` directly on host
#   - traefik_net is created as a local stub (no real Traefik in dev)

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend/src:/app/src
      - ./backend/scripts:/app/scripts
      - ./backend/prisma:/app/prisma
      - ./src:/src                      # frontend src — needed by scripts/extractBlueprints.ts
      - uploads:/app/uploads
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      LOCAL_AUTH_ENABLED: "true"
      LOG_LEVEL: debug

  frontend:
    profiles:
      - donotstart  # frontend runs on host via `quasar dev` during development

networks:
  traefik_net:
    external: false
