# Production compose — frontend is pulled from ghcr.io (built by GHA),
# not built locally. Use this file in Portainer.
#
# For local image building / Dockerfile testing, use docker-compose.yml,
# which keeps the `build:` section.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fantasia
      POSTGRES_USER: fantasia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasia"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fantasia:${POSTGRES_PASSWORD}@postgres:5432/fantasia
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY:-900}
      REFRESH_TOKEN_EXPIRY_DAYS: ${REFRESH_TOKEN_EXPIRY_DAYS:-7}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${BACKEND_URL}/auth/callback
      LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED:-false}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      UPLOAD_DIR: /app/uploads
      NODE_ENV: production
      PORT: 3000
    volumes:
      - uploads:/app/uploads
    networks:
      - internal
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_net"
      - "traefik.http.routers.fa-backend.rule=Host(`${BACKEND_HOST}`)"
      - "traefik.http.routers.fa-backend.entrypoints=websecure"
      - "traefik.http.routers.fa-backend.tls=true"
      - "traefik.http.routers.fa-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.fa-backend.loadbalancer.server.port=3000"

  frontend:
    image: ghcr.io/openningia/fantasia-archive-web/frontend:${FRONTEND_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_net"
      - "traefik.http.routers.fa-frontend.rule=Host(`${FRONTEND_HOST}`)"
      - "traefik.http.routers.fa-frontend.entrypoints=websecure"
      - "traefik.http.routers.fa-frontend.tls=true"
      - "traefik.http.routers.fa-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.fa-frontend.loadbalancer.server.port=80"

volumes:
  postgres_data:
  redis_data:
  uploads:

networks:
  internal:
    driver: bridge
  traefik_net:
    external: true
